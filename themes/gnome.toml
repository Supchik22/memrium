name = "GNOME"
layout = "macos"
dark = false
# Adwaita blue
accent = [0.21, 0.52, 0.89]

# flat, lightly frosted surfaces: some blur, no refraction, no rim light
[glass]
blur = 18.0
refraction = 0.0
bezel = 8.0
dispersion = 0.0
rim = 0.0
rim_sharp = 0.0
gloss = 0.0
saturation = 1.10
adapt = 0.0
tint = [0.96, 0.96, 0.97, 0.80]
border = [0.0, 0.0, 0.0, 0.12]
shadow = [0.25, 28.0, 10.0]

# Adwaita windows: a header bar with the title in the middle and round buttons on the right
[window]
decoration = "gnome"
radius = 12.0
titlebar = 46.0
title_align = "center"
shadow = [0.38, 40.0, 14.0]
shadow_idle = [0.20, 26.0, 8.0]
client_opacity = 0.94

# the top bar is always black in GNOME
[menubar]
height = 32.0
bar = true
kind = "solid"
opacity = 1.0
blur = 0.0
border = false
show_title = false
color = [0.0, 0.0, 0.0]

[dock]
icon_size = 48.0
magnify = false
radius = 18.0
gap = 8.0

[launcher]
style = "figlet"

[icons]
shape = "rounded"
plate = "tile"
tile = "vivid"
padding = 0.14

# the bars: Activities on the left, the clock in the middle, the system menu on the right; the dash at the bottom
[[bars]]
name = "menubar"
edge = "top"
shape = "strip"
left = [{ kind = "button", icon = "layout-grid", action = "launcher" }]
center = [{ kind = "clock", format = "%a %b %e  %H:%M" }]
right = ["wifi", "volume", "battery", "control-center"]

[[bars]]
name = "dock"
edge = "bottom"
shape = "floating"
center = ["dock"]

# motion: calm and quick, with a short fade
[animations]
speed = 1.1
switch = "fade"
switch_ms = 400
rim = false
