name = "Plasma"
layout = "taskbar"
dark = true
# Breeze blue
accent = [0.24, 0.68, 0.91]

# Breeze Dark: a nearly flat dark surface, a little blur, no refraction or rim light
[glass]
blur = 18.0
refraction = 0.0
bezel = 6.0
dispersion = 0.0
rim = 0.0
gloss = 0.0
saturation = 1.0
adapt = 0.0
tint = [0.14, 0.16, 0.18, 0.92]
tint_accent = false
border = [1.0, 1.0, 1.0, 0.06]
shadow = [0.30, 24.0, 8.0]

[window]
decoration = "win11"
radius = 5.0
titlebar = 30.0
# the shadow these looks have always had (the default follows macOS now)
shadow = [0.42, 46.0, 22.0]
shadow_idle = [0.22, 30.0, 12.0]
title_align = "center"

# the panel: a full-width strip along the bottom, the Kickoff button, desktops, tasks, tray, clock, show desktop
[[bars]]
name = "panel"
edge = "bottom"
shape = "strip"
surface = "glass"
height = 44.0
left = [
    { kind = "start", style = "breeze", display = "icon", pack_icon = "start-here-kde-plasma", glyph = "layout-grid", size = 36.0, icon_size = 24.0, menu = "plasma", menu_align = "button" },
    { kind = "workspaces" },
    { kind = "dock", magnify = false, tooltips = true, bounce = false, separators = false, previews = true, gap = 2.0, pad = 3.0, icon_size = 26.0, button_w = 42.0, indicator = "underline", running_bg = "button", running_color = "ink", running_opacity = 0.0, focus_boost = 0.14, hover_bg = "button", hover_color = "ink", hover_opacity = 0.14 },
]
right = [
    { kind = "tray", icons = ["wifi", "volume-2", "battery-full"] },
    { kind = "clock", format = "%H:%M", format2 = "%d.%m.%y" },
    { kind = "show-desktop" },
]

[bars.glass]
blur = 18.0
refraction = 0.0
bezel = 6.0
dispersion = 0.0
rim = 0.0
gloss = 0.0
saturation = 1.0
tint = [0.12, 0.14, 0.16, 0.94]
border = [1.0, 1.0, 1.0, 0.07]
shadow = [0.0, 0.0, 0.0]

[launcher]
style = "plasma"

[icons]
shape = "none"
plate = "none"
padding = 0.0

# Plasma's motion: short and plain
[animations]
speed = 1.1
switch = "fade"
switch_ms = 300
rim = false
