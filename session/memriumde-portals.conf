# xdg-desktop-portal backends for Memrium (XDG_CURRENT_DESKTOP=Memrium).
# Install as ~/.config/xdg-desktop-portal/memrium-portals.conf
#
# Screen sharing and screenshots go through xdg-desktop-portal-wlr, which talks wlr-screencopy to the compositor
# and hands the frames to PipeWire. File dialogs and everything else use the GTK backend.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
