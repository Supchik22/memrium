# xdg-desktop-portal backends for Memrium (XDG_CURRENT_DESKTOP=Memrium).
# Install as ~/.config/xdg-desktop-portal/memrium-portals.conf
#
# Screen sharing (the whole screen or one window) is memrium_portal: it takes the pictures with ext-image-copy-capture
# and offers them as a PipeWire node. Screenshots go through xdg-desktop-portal-wlr. File dialogs are Memrium Files (memrium_portal); everything else uses the GTK backend.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=memrium
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.FileChooser=memrium
