[package]
name = "memrium-de"
version = "0.1.0"
edition = "2021"
description = "The Memrium desktop shell: a Wayland compositor with a GPU jelly-glass renderer, bars, dock, launcher, settings, and the library its programs share."
license = "MIT"
repository = "https://github.com/Supchik22/memrium"
default-run = "memrium_compositor"

[[bin]]
name = "memrium_preview"
path = "src/main.rs"

[dependencies]
# the first page of a PDF for its thumbnail in Files (pure Rust; 0.6 is the last that builds on rustc 1.91, see vendor/vello_*)
hayro = "=0.6.0"
# file names of the shared thumbnail cache (~/.cache/thumbnails: the MD5 of the file's URI)
md-5 = "0.10"
# the text fields of the thumbnails kept on disk (Thumb::URI, Thumb::MTime), the same version the image crate uses
png = "0.17"
chebrium = { git = "https://github.com/Supchik22/chebrium" }
wgpu = { version = "25" }
pollster = "0.4"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "xwayland", "backend_drm"] }
calloop = "0.14"
ash = "0.38"
libloading = "0.8"
zbus = "5"
blocking = "1"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
libc = "0.2"
wayland-scanner = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["server"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# the screen-sharing portal feeds a PipeWire stream
pipewire = "0.9"
# the image viewer's object cut-out and text recognition (MobileSAM, PP-OCRv5): onnxruntime when it is installed
# (loaded at run time), tract as the built-in fallback
tract-onnx = "0.21"
rqrr = { version = "0.11", default-features = false }
wayland-backend = { version = "0.3", features = ["client_system"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "std", "api-22"] }
# fast, well-mixed hasher for the per-frame change detection
foldhash = "0.1"
x11rb = { version = "0.13", default-features = false }
drm = "0.14"
drm-fourcc = "2"
input = "0.9"
libseat = "0.2"
rustix = { version = "1", features = ["event", "fs"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
# archives (the archive manager and the "Extract" / "Compress" entries of Files)
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.5"
xz2 = "0.1"
zstd = "0.13"
sevenz-rust2 = { version = "0.13", default-features = false, features = ["compress"] }

# copies of the CPU rasteriser hayro draws PDF pages with: only their `rust-version` says 1.91 (they build on it; ours is 1.91)
[patch.crates-io]
vello_api = { path = "vendor/vello_api" }
vello_common = { path = "vendor/vello_common" }
vello_cpu = { path = "vendor/vello_cpu" }
